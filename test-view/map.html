<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helbreath Map Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 10;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
      white-space: nowrap;
    }

    header a {
      color: #533483;
      font-size: 13px;
      text-decoration: none;
    }
    header a:hover { color: #e94560; }

    select, button {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #533483;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    select:hover, button:hover { background: #533483; }
    button:active { background: #e94560; }

    .separator { width: 1px; height: 24px; background: #533483; }

    .status {
      font-size: 12px;
      color: #e94560;
      flex: 1;
      text-align: right;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    canvas { display: block; }

    .info-bar {
      background: #16213e;
      border-top: 1px solid #0f3460;
      padding: 6px 20px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: #aaa;
      z-index: 10;
    }

    .info-bar .il { color: #666; }
    .info-bar .iv { color: #e0e0e0; }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      gap: 12px;
    }

    .loading-overlay.hidden { display: none; }

    .loading-bar {
      width: 300px;
      height: 6px;
      background: #0f3460;
      border-radius: 3px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      background: #e94560;
      width: 0%;
      transition: width 0.2s;
    }

    .loading-text {
      font-size: 13px;
      color: #aaa;
    }

    .minimap {
      position: absolute;
      bottom: 40px;
      right: 10px;
      border: 1px solid #533483;
      background: #111;
      image-rendering: pixelated;
      z-index: 5;
    }

    .controls-hint {
      position: absolute;
      bottom: 50px;
      left: 10px;
      font-size: 11px;
      color: #555;
      z-index: 5;
      line-height: 1.6;
    }

    /* ── Effects Panel (matches DDrawEngine DrawParams) ── */
    .effects-bar {
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      padding: 6px 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      z-index: 10;
    }

    .eg {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .eg label {
      font-size: 11px;
      color: #888;
    }

    .eg input[type="range"] {
      width: 68px;
      accent-color: #e94560;
    }

    .eg .val {
      font-size: 10px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: #e0e0e0;
      min-width: 32px;
      text-align: right;
    }

    .eg input[type="checkbox"] {
      accent-color: #e94560;
    }

    .tint-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1px solid #533483;
      border-radius: 2px;
      vertical-align: middle;
    }

    .effect-presets {
      display: flex;
      gap: 3px;
    }

    .effect-presets button {
      padding: 1px 6px;
      font-size: 10px;
      min-width: unset;
    }

    .effect-presets button.active {
      background: #e94560;
      border-color: #e94560;
    }

    button.sm {
      font-size: 10px;
      padding: 2px 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Map Viewer</h1>
    <a href="/">&larr; Sprite Viewer</a>
    <div class="separator"></div>
    <select id="map-select">
      <option value="">-- Select a Map --</option>
    </select>
    <button id="load-btn">Load</button>
    <div class="separator"></div>
    <select id="char-select">
      <option value="Wm">Woman (Wm)</option>
      <option value="Bm">Man (Bm)</option>
    </select>
    <div class="status" id="status">Ready</div>
  </header>

  <!-- Effects bar (DDrawEngine DrawParams / AlphaDegree simulation) -->
  <div class="effects-bar" id="effects-bar">
    <div class="eg">
      <label>Time:</label>
      <input type="range" id="alpha-degree" min="1" max="13" value="1" />
      <span class="val" id="alpha-degree-val">Day</span>
    </div>
    <div class="separator"></div>
    <div class="eg">
      <label>Alpha:</label>
      <div class="effect-presets">
        <button id="alpha-100" class="active">100</button>
        <button id="alpha-70">70</button>
        <button id="alpha-50">50</button>
      </div>
      <input type="range" id="alpha-slider" min="0" max="100" value="100" />
      <span class="val" id="alpha-val">100%</span>
    </div>
    <div class="separator"></div>
    <div class="eg">
      <label style="color:#e66">R:</label>
      <input type="range" id="tint-r" min="-255" max="255" value="0" />
      <span class="val" id="tint-r-val">0</span>
    </div>
    <div class="eg">
      <label style="color:#6e6">G:</label>
      <input type="range" id="tint-g" min="-255" max="255" value="0" />
      <span class="val" id="tint-g-val">0</span>
    </div>
    <div class="eg">
      <label style="color:#66e">B:</label>
      <input type="range" id="tint-b" min="-255" max="255" value="0" />
      <span class="val" id="tint-b-val">0</span>
    </div>
    <span class="tint-swatch" id="tint-swatch"></span>
    <div class="separator"></div>
    <div class="eg">
      <input type="checkbox" id="show-blocked" />
      <label for="show-blocked">Blocked</label>
    </div>
    <div class="eg">
      <input type="checkbox" id="show-teleports" />
      <label for="show-teleports">Teleports</label>
    </div>
    <div class="eg">
      <input type="checkbox" id="show-grid" />
      <label for="show-grid">Grid</label>
    </div>
    <div class="separator"></div>
    <button class="sm" id="reset-effects">Reset</button>
  </div>

  <div class="canvas-container" id="canvas-container">
    <div class="loading-overlay hidden" id="loading-overlay">
      <div class="loading-text" id="loading-text">Loading...</div>
      <div class="loading-bar"><div class="loading-bar-fill" id="loading-fill"></div></div>
    </div>
    <canvas class="minimap" id="minimap" width="150" height="150"></canvas>
    <div class="controls-hint">
      Left click: walk to<br>
      Right click: run to<br>
      Arrow keys: move<br>
      Shift+Arrows: run<br>
      +/- : zoom
    </div>
  </div>

  <div class="info-bar">
    <div><span class="il">Map:</span> <span class="iv" id="info-map">-</span></div>
    <div><span class="il">Size:</span> <span class="iv" id="info-size">-</span></div>
    <div><span class="il">Pos:</span> <span class="iv" id="info-pos">-</span></div>
    <div><span class="il">Tile:</span> <span class="iv" id="info-tile">-</span></div>
    <div><span class="il">Tiles loaded:</span> <span class="iv" id="info-loaded">0</span></div>
    <div><span class="il">FPS:</span> <span class="iv" id="info-fps">0</span></div>
    <div><span class="il">Effect:</span> <span class="iv" id="info-effect">Day</span></div>
  </div>

  <script type="module" src="/src/map.ts"></script>
</body>
</html>
